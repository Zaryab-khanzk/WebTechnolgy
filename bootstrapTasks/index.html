<!doctype html>
<head>
  <title>User Registration Form</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/css/bootstrap.min.css" rel="stylesheet" />
</head>
<body>
  <div class="container my-5">
    <h2 class="mb-4">User Registration Form</h2>
    <form id="registrationForm" novalidate>
      <!-- Text Inputs -->
      <div class="mb-3">
        <label for="name" class="form-label">Name *</label>
        <input type="text" class="form-control" id="name" name="name" required />
      </div>
      <div class="mb-3">
        <label for="password" class="form-label">Password *</label>
        <input type="password" class="form-control" id="password" name="password" required />
      </div>
      <div class="mb-3">
        <label for="email" class="form-label">Email *</label>
        <input type="email" class="form-control" id="email" name="email" required />
      </div>
      <div class="mb-3">
        <label for="age" class="form-label">Age (18-60) *</label>
        <input type="number" class="form-control" id="age" name="age" min="18" max="60" required />
      </div>
      <div class="mb-3">
        <label for="phone" class="form-label">Phone (11 digits) *</label>
        <input type="tel" class="form-control" id="phone" name="phone" pattern="\d{11}" required />
      </div>
      <div class="mb-3">
        <label for="website" class="form-label">Website URL *</label>
        <input type="url" class="form-control" id="website" name="website" placeholder="https://example.com" required />
      </div>
      <div class="mb-3">
        <label for="search" class="form-label">Search Box</label>
        <input type="search" class="form-control" id="search" name="search" />
      </div>

      <!-- Choice Inputs -->
      <fieldset class="mb-3">
        <legend>Gender *</legend>
        <div class="form-check form-check-inline">
          <input class="form-check-input" type="radio" name="gender" id="male" value="Male" required>
          <label class="form-check-label" for="male">Male</label>
        </div>
        <div class="form-check form-check-inline">
          <input class="form-check-input" type="radio" name="gender" id="female" value="Female" required>
          <label class="form-check-label" for="female">Female</label>
        </div>
      </fieldset>
      <fieldset class="mb-3">
        <legend>Hobbies *</legend>
        <div class="form-check form-check-inline">
          <input class="form-check-input" type="checkbox" name="hobbies" id="reading" value="Reading" />
          <label class="form-check-label" for="reading">Reading</label>
        </div>
        <div class="form-check form-check-inline">
          <input class="form-check-input" type="checkbox" name="hobbies" id="sports" value="Sports" />
          <label class="form-check-label" for="sports">Sports</label>
        </div>
        <div class="form-check form-check-inline">
          <input class="form-check-input" type="checkbox" name="hobbies" id="traveling" value="Traveling" />
          <label class="form-check-label" for="traveling">Traveling</label>
        </div>
      </fieldset>
      <div class="mb-3">
        <label for="favcolor" class="form-label">Favorite Color</label>
        <input type="color" class="form-control form-control-color" id="favcolor" name="favcolor" value="#563d7c" title="Choose your color" />
      </div>

      <!-- Date and Time Inputs -->
      <div class="mb-3">
        <label for="dob" class="form-label">Date of Birth</label>
        <input type="date" class="form-control" id="dob" name="dob" />
      </div>
      <div class="mb-3">
        <label for="meeting" class="form-label">Meeting Schedule</label>
        <input type="datetime-local" class="form-control" id="meeting" name="meeting" />
      </div>
      <div class="mb-3">
        <label for="month" class="form-label">Month</label>
        <input type="month" class="form-control" id="month" name="month" />
      </div>
      <div class="mb-3">
        <label for="time" class="form-label">Time</label>
        <input type="time" class="form-control" id="time" name="time" />
      </div>
      <div class="mb-3">
        <label for="week" class="form-label">Week</label>
        <input type="week" class="form-control" id="week" name="week" />
      </div>

      <!-- File and Range Inputs -->
      <div class="mb-3">
        <label for="profilepic" class="form-label">Upload Profile Picture *</label>
        <input type="file" class="form-control" id="profilepic" name="profilepic" accept="image/*" required />
      </div>
      <div class="mb-3">
        <label for="satisfaction" class="form-label">Satisfaction Level</label>
        <input type="range" class="form-range" id="satisfaction" name="satisfaction" min="0" max="10" />
      </div>

      <!-- Hidden Field -->
      <input type="hidden" id="user_id" name="user_id" value="12345" />

      <!-- Buttons -->
      <button type="submit" class="btn btn-primary me-2">Submit</button>
      <button type="reset" class="btn btn-secondary me-2">Reset</button>
      <button type="button" class="btn btn-info" onclick="alert('Custom button clicked!')">Custom</button>
    </form>
  </div>

  <script>
    document.getElementById('registrationForm').addEventListener('submit', function(event) {
      const form = event.target;

      // Name not empty
      const name = form.name.value.trim();
      if (!name) {
        alert('Name is required.');
        event.preventDefault();
        return;
      }

      // Email contains '@' and '.'
      const email = form.email.value;
      if (!email.includes('@') || !email.includes('.')) {
        alert('Please enter a valid email address.');
        event.preventDefault();
        return;
      }

      // Password length >= 8
      const password = form.password.value;
      if (password.length < 8) {
        alert('Password must be at least 8 characters long.');
        event.preventDefault();
        return;
      }

      // Age between 18 and 60
      const age = Number(form.age.value);
      if (!age || age < 18 || age > 60) {
        alert('Age must be between 18 and 60.');
        event.preventDefault();
        return;
      }

      // Phone exactly 11 digits
      const phone = form.phone.value;
      const phoneDigitsOnly = phone.replace(/\D/g, '');
      if (phoneDigitsOnly.length !== 11) {
        alert('Phone number must be exactly 11 digits.');
        event.preventDefault();
        return;
      }

      // Website starts with http:// or https://
      const website = form.website.value;
      if (!(website.startsWith('http://') || website.startsWith('https://'))) {
        alert('Website URL must start with http:// or https://');
        event.preventDefault();
        return;
      }

      // At least one hobby checked
      const hobbies = form.querySelectorAll('input[name="hobbies"]:checked');
      if (hobbies.length === 0) {
        alert('Please select at least one hobby.');
        event.preventDefault();
        return;
      }

      // Gender must be selected
      const gender = form.querySelector('input[name="gender"]:checked');
      if (!gender) {
        alert('Please select a gender.');
        event.preventDefault();
        return;
      }

      // Profile picture uploaded
      const profilePic = form.profilepic.files.length;
      if (profilePic === 0) {
        alert('Please upload a profile picture.');
        event.preventDefault();
        return;
      }
    });
  </script>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
