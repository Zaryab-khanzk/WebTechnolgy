    <script>
            
        function maxNum(a, b) {
        if (a > b) {
            return a;
        } else {
            return b;
        }
        }
        const num1 = parseFloat(prompt("Enter the first number:"));
        const num2 = parseFloat(prompt("Enter the second number:"));
        const greater = maxNum(num1, num2);
        console.log("The greater number is: " + greater);

    </script>
