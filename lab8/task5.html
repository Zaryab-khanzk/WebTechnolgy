<!DOCTYPE html>
<html>
<head>
    <title>Prime Numbers 1 to 100</title>
</head>
<body>
    <script>
        function printPrimes() {
            for (let num = 2; num <= 100; num++) {
                let isPrime = true;

                for (let i = 2; i <= Math.sqrt(num); i++) {
                    if (num % i === 0) {
                        isPrime = false;
                        break;
                    }
                }

                if (isPrime) {
                    console.log(num);
                }
            }
        }

        printPrimes();
    </script>
</body>
</html>
