<!DOCTYPE html>
<html>
<head>
    <title>Signup Form Validation</title>
    <style>
        .error {
            color: red;
            font-size: 14px;
            margin-top: 4px;
        }
    </style>
</head>
<body>
    <form id="signupForm" novalidate>
        <label>Email:</label><br>
        <input type="text" id="email" name="email"><br>
        <div id="emailError" class="error"></div>

        <label>Password:</label><br>
        <input type="password" id="password" name="password"><br>
        <div id="passwordError" class="error"></div>

        <button type="submit">Sign Up</button>
    </form>

    <script>
        const form = document.getElementById('signupForm');
        const emailInput = document.getElementById('email');
        const passwordInput = document.getElementById('password');
        const emailError = document.getElementById('emailError');
        const passwordError = document.getElementById('passwordError');

        form.addEventListener('submit', function(event) {
            event.preventDefault(); // prevent form from submitting

            emailError.textContent = '';
            passwordError.textContent = '';

            const emailPattern = /^[a-z0-9._%+-]+@cui\.edu\.pk$/i;
            const password = passwordInput.value;
            const email = emailInput.value;

            let valid = true;

            // Validate email
            if (!emailPattern.test(email)) {
                emailError.textContent = 'Email must be a valid @cui.edu.pk address.';
                valid = false;
            }

            // Validate password length
            if (password.length < 8) {
                passwordError.textContent = 'Password must be at least 8 characters.';
                valid = false;
            }
            // Validate uppercase letter
            else if (!/[A-Z]/.test(password)) {
                passwordError.textContent = 'Password must contain at least 1 uppercase letter.';
                valid = false;
            }
            // Validate lowercase letter
            else if (!/[a-z]/.test(password)) {
                passwordError.textContent = 'Password must contain at least 1 lowercase letter.';
                valid = false;
            }
            // Validate digit
            else if (!/[0-9]/.test(password)) {
                passwordError.textContent = 'Password must contain at least 1 digit.';
                valid = false;
            }
            // Validate symbol
            else if (!/[!@#$%^&*(),.?":{}|<>_\-+=]/.test(password)) {
                passwordError.textContent = 'Password must contain at least 1 symbol.';
                valid = false;
            }

            if (valid) {
                alert('Signup successful!');
                form.reset();
            }
        });
    </script>
</body>
</html>
