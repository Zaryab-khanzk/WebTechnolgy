<!DOCTYPE html>
<html>
<head>
    <title>Countdown Timer</title>
</head>
<body>
    <h1>Countdown: <span id="timer">60</span> seconds</h1>
    <script>
        let timeLeft = 60; // starting from 60 seconds
        const timerElement = document.getElementById('timer');

        const countdown = setInterval(function() {
            if (timeLeft > 0) {
                timeLeft--;
                timerElement.textContent = timeLeft;
            } else {
                clearInterval(countdown);
                alert("Time's up!");
            }
        }, 1000);
    </script>
</body>
</html>
